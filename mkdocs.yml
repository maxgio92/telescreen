site_name: telescreen
site_url: https://maxgio92.github.io/telescreen/
repo_url: https://github.com/maxgio92/telescreen
repo_name: maxgio92/telescreen
docs_dir: docs

validation:
  links:
    anchors: warn

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Documentation: hub.md
  - Getting started:
      - Install: getting-started/install.md
      - Enroll the agents: getting-started/enroll.md
      - Your first record: getting-started/first-record.md
  - Guides:
      - Configuration: guides/configuration.md
      - Use another agent: guides/use-another-agent.md
      - Write a producer: guides/write-a-producer.md
      - Swap the actor: guides/swap-the-actor.md
      - Troubleshooting: guides/troubleshooting.md
  - Reference:
      - Configuration: reference/configuration.md
      - Vocabulary: reference/vocabulary.md
      - CLI:
          - telescreen: reference/telescreen.md
          - telescreen demo: reference/telescreen_demo.md
          - telescreen export: reference/telescreen_export.md
          - telescreen install: reference/telescreen_install.md
          - telescreen minitrue: reference/telescreen_minitrue.md
          - telescreen speakwrite: reference/telescreen_speakwrite.md
          - telescreen thinkpol: reference/telescreen_thinkpol.md
          - telescreen update: reference/telescreen_update.md
          - telescreen verify: reference/telescreen_verify.md
          - telescreen version: reference/telescreen_version.md
          - telescreen completion: reference/telescreen_completion.md
          - telescreen completion bash: reference/telescreen_completion_bash.md
          - telescreen completion fish: reference/telescreen_completion_fish.md
          - telescreen completion powershell: reference/telescreen_completion_powershell.md
          - telescreen completion zsh: reference/telescreen_completion_zsh.md
  - Contracts:
      - Queue contract: contracts/recdep.md
      - Actor contract: contracts/thinkpol.md
  - Design:
      - speakwrite: design/speakwrite.md
      - The names: design/names.md
