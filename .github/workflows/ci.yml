name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "files need gofmt:" && echo "$out"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - name: unit tests
        run: go test -coverprofile=unit.out ./...
      - name: e2e tests
        run: |
          mkdir -p covdata
          GOCOVERDIR="$PWD/covdata" go test -count=1 -tags e2e ./e2e/
          go tool covdata textfmt -i covdata -o e2e.out
      - name: coverage report
        run: |
          report() {
            echo "## $1"
            echo
            go tool cover -func="$2" | awk '/^total:/ {print "Total: " $3}'
            echo
            echo "| Package | Coverage (mean per function) |"
            echo "|---|---|"
            go tool cover -func="$2" | awk '!/^total:/ {
              split($1, loc, ":")
              pkg = loc[1]; sub("/[^/]*$", "", pkg)
              sub("^github.com/maxgio92/telescreen/?", "", pkg)
              if (pkg == "") pkg = "."
              sub("%", "", $3); sum[pkg] += $3; n[pkg]++
            } END { for (p in sum) printf "| %s | %.1f%% |\n", p, sum[p] / n[p] }' | sort
            echo
          }
          {
            report "Unit" unit.out
            report "E2E" e2e.out
          } >> "$GITHUB_STEP_SUMMARY"
      - name: CLI reference is regenerated
        run: make docs-check
      - name: no employer references
        run: |
          leak="chain''guard"
          pattern=$(printf '%s' "$leak" | tr -d "'")
          if grep -rniI "$pattern" . --exclude-dir=.git; then
            echo "employer reference found; this repo stays neutral" >&2
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
